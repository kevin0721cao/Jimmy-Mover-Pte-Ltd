<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WorkPunch Pro 考勤系统</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    }

    body {
      background-color: #0b0f17;
      color: #ffffff;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* 顶部导航 */
    .header {
      height: 60px;
      padding: 0 24px;
      background-color: #0f1523;
      border-bottom: 1px solid #1e293b;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 12px;
      font-size: 18px;
      font-weight: 600;
    }

    .logo-icon {
      width: 32px;
      height: 32px;
      background: #2563eb;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .sub-title {
      font-size: 12px;
      color: #64748b;
      margin-left: 8px;
    }

    .nav-btns {
      display: flex;
      gap: 12px;
    }

    .btn-nav {
      padding: 8px 16px;
      border-radius: 6px;
      border: 1px solid #334155;
      background: #1e293b;
      color: #94a3b8;
      cursor: pointer;
      font-size: 14px;
      transition: all 0.2s;
    }

    .btn-nav.active {
      background: #2563eb;
      color: #ffffff;
      border-color: #2563eb;
    }

    /* 主体容器 */
    .container {
      padding: 24px;
      flex: 1;
      max-width: 1400px;
      margin: 0 auto;
      width: 100%;
    }

    /* 视图切换 */
    .view-section {
      display: none;
    }
    .view-section.active {
      display: block;
    }

    /* 员工端打卡界面 */
    .punch-card {
      background: #151d2a;
      border: 1px solid #1e293b;
      border-radius: 12px;
      padding: 40px 24px;
      text-align: center;
      max-width: 500px;
      margin: 40px auto;
    }

    .clock-display {
      font-size: 48px;
      font-weight: bold;
      letter-spacing: 2px;
      margin-bottom: 8px;
    }

    .date-display {
      color: #64748b;
      font-size: 14px;
      margin-bottom: 32px;
    }

    .punch-btns {
      display: flex;
      justify-content: center;
      gap: 32px;
      margin-top: 24px;
    }

    .btn-circle {
      width: 110px;
      height: 110px;
      border-radius: 50%;
      border: none;
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      box-shadow: 0 4px 20px rgba(0,0,0,0.3);
      transition: transform 0.1s, opacity 0.2s;
    }

    .btn-circle:active {
      transform: scale(0.95);
    }

    .btn-start { background: linear-gradient(135deg, #2563eb, #1d4ed8); }
    .btn-end { background: linear-gradient(135deg, #059669, #047857); }

    /* 后台栅格布局 */
    .admin-grid {
      display: grid;
      grid-template-columns: 360px 1fr;
      gap: 20px;
      margin-bottom: 20px;
    }

    .card {
      background: #151d2a;
      border: 1px solid #1e293b;
      border-radius: 12px;
      padding: 20px;
    }

    .card-title {
      font-size: 16px;
      font-weight: 600;
      margin-bottom: 20px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    /* 表单与输入框 */
    .form-group {
      margin-bottom: 16px;
    }

    .form-group label {
      display: block;
      font-size: 13px;
      color: #94a3b8;
      margin-bottom: 6px;
    }

    .form-control {
      width: 100%;
      background: #0b0f17;
      border: 1px solid #334155;
      border-radius: 6px;
      padding: 10px 12px;
      color: #ffffff;
      font-size: 14px;
      outline: none;
    }

    .form-control:focus {
      border-color: #2563eb;
    }

    .form-row {
      display: flex;
      gap: 12px;
    }

    .btn-submit {
      width: 100%;
      padding: 10px;
      background: #2563eb;
      color: white;
      border: none;
      border-radius: 6px;
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
    }

    .btn-submit:hover {
      background: #1d4ed8;
    }

    /* 看板统计 */
    .stats-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 16px;
      margin-bottom: 20px;
    }

    .stat-card {
      background: #0b0f17;
      border: 1px solid #1e293b;
      border-radius: 8px;
      padding: 16px;
      text-align: center;
    }

    .stat-label {
      font-size: 13px;
      color: #64748b;
      margin-bottom: 8px;
    }

    .stat-value {
      font-size: 28px;
      font-weight: bold;
    }

    /* 表格 */
    .data-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 14px;
      margin-top: 12px;
    }

    .data-table th, .data-table td {
      padding: 12px 16px;
      text-align: left;
      border-bottom: 1px solid #1e293b;
    }

    .data-table th {
      color: #64748b;
      font-weight: 500;
      background: #0b0f17;
    }

    .badge {
      display: inline-block;
      padding: 2px 8px;
      border-radius: 4px;
      font-size: 12px;
    }
    .badge-normal { background: rgba(16, 185, 129, 0.1); color: #10b981; }
    .badge-late { background: rgba(245, 158, 11, 0.1); color: #f59e0b; }

    /* 密码验证弹窗 */
    .modal-overlay {
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0, 0, 0, 0.75);
      display: none;
      justify-content: center;
      align-items: center;
      z-index: 1000;
    }

    .modal-box {
      background: #151d2a;
      border: 1px solid #334155;
      border-radius: 12px;
      padding: 24px;
      width: 380px;
      box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5);
    }

    .modal-actions {
      display: flex;
      gap: 12px;
      margin-top: 20px;
    }

    .btn-cancel {
      flex: 1;
      padding: 10px;
      background: #1e293b;
      border: 1px solid #334155;
      color: #94a3b8;
      border-radius: 6px;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <!-- 头部导航栏 -->
  <div class="header">
    <div class="logo">
      <div class="logo-icon">🕒</div>
      <span>WorkPunch Pro 考勤系统</span>
      <span class="sub-title">GPS / Wi-Fi / 现场拍照防伪打卡</span>
    </div>
    <div class="nav-btns">
      <button class="btn-nav active" id="btnEmployeeView" onclick="switchToEmployeeView()">👤 员工端</button>
      <button class="btn-nav" id="btnAdminView" onclick="triggerAdminAuth()">🛡️ 管理员后台</button>
    </div>
  </div>

  <div class="container">
    
    <!-- 1. 员工打卡界面 -->
    <div id="employeeSection" class="view-section active">
      <div class="punch-card">
        <div class="clock-display" id="clockDisplay">00:00:00</div>
        <div class="date-display" id="dateDisplay">2026-10-06 星期二</div>
