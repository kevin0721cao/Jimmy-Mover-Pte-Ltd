<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>WorkPunch Pro 考勤系统</title>
  <style>
    /* 样式适配现有暗黑主题 */
    body {
      margin: 0;
      background-color: #0b0f19;
      color: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    .modal-overlay {
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0, 0, 0, 0.7);
      display: flex; justify-content: center; align-items: center;
      z-index: 1000;
    }
    .modal-box {
      background: #151c2c;
      border: 1px solid #2a3447;
      border-radius: 12px;
      padding: 24px;
      width: 360px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.5);
    }
    .modal-title {
      font-size: 18px;
      font-weight: bold;
      margin-bottom: 16px;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .form-group {
      margin-bottom: 16px;
    }
    .form-group label {
      display: block;
      font-size: 13px;
      color: #8a99ad;
      margin-bottom: 6px;
    }
    .form-control {
      width: 100%;
      box-sizing: border-box;
      background: #0b0f19;
      border: 1px solid #2a3447;
      border-radius: 6px;
      padding: 10px 12px;
      color: #fff;
      font-size: 14px;
      outline: none;
    }
    .form-control:focus {
      border-color: #2563eb;
    }
    .btn-group {
      display: flex;
      gap: 12px;
      margin-top: 20px;
    }
    .btn {
      flex: 1;
      padding: 10px;
      border-radius: 6px;
      border: none;
      cursor: pointer;
      font-size: 14px;
      font-weight: 500;
    }
    .btn-primary { background: #2563eb; color: #fff; }
    .btn-primary:hover { background: #1d4ed8; }
    .btn-secondary { background: #2a3447; color: #8a99ad; }
    .btn-secondary:hover { background: #374357; }
    
    /* 规则卡片样式 */
    .card {
      background: #151c2c;
      border-radius: 10px;
      padding: 20px;
      border: 1px solid #2a3447;
      width: 320px;
      margin: 20px;
    }
    .card-title {
      font-size: 15px;
      font-weight: bold;
      margin-bottom: 16px;
      color: #fff;
    }
  </style>
</head>
<body>

  <!-- 1. 验证弹窗（修复了泄漏默认密码的问题） -->
  <div id="authModal" class="modal-overlay" style="display: flex;">
    <div class="modal-box">
      <div class="modal-title">
        <span>🔒</span> 管理员身份验证
      </div>
      <div class="form-group">
        <!-- 移除了默认密码提示提示 (默认密码: 123456) -->
        <label for="adminPasswordInput">请输入后台授权密码</label>
        <input type="password" id="adminPasswordInput" class="form-control" placeholder="请输入授权密码" />
      </div>
      <div class="btn-group">
        <button class="btn btn-secondary" onclick="closeAuthModal()">取消</button>
        <button class="btn btn-primary" onclick="verifyAdminPassword()">验证登录</button>
      </div>
    </div>
  </div>

  <!-- 2. 后台配置卡片（新增了管理员密码修改框） -->
  <div class="card">
    <div class="card-title">⚙️️ 考勤规则与系统设置</div>
    
    <div class="form-group">
      <label>标准上班时间</label>
      <input type="time" id="workStart" class="form-control" value="09:00" />
    </div>
    
    <div class="form-group">
      <label>标准下班时间</label>
      <input type="time" id="workEnd" class="form-control" value="18:00" />
    </div>

    <!-- 新增：管理员授权密码设置项 -->
    <div class="form-group" style="border-top: 1px dashed #2a3447; padding-top: 12px; margin-top: 12px;">
      <label style="color: #60a5fa; font-weight: bold;">修改管理员授权密码</label>
      <input type="password" id="newAdminPassword" class="form-control" placeholder="留空则保持原密码不变" />
    </div>

    <button class="btn btn-primary" style="width: 100%; margin-top: 10px;" onclick="saveSystemSettings()">保存配置规则</button>
  </div>

  <script>
    // 定义常量与初始全局密码 (若本地无记录则默认为 123456)
    const STORAGE_KEY = 'workpunch_admin_password';

    function getStoredPassword() {
      return localStorage.getItem(STORAGE_KEY) || '123456';
    }

    // 验证管理员密码入口
    function verifyAdminPassword() {
      const inputPwd = document.getElementById('adminPasswordInput').value;
      const currentPwd = getStoredPassword();

      if (inputPwd === currentPwd) {
        alert('验证成功！已进入管理员后台');
        document.getElementById('authModal').style.display = 'none';
        document.getElementById('adminPasswordInput').value = ''; // 清空输入框
      } else {
        alert('密码错误，请重新输入！');
      }
    }

    // 关闭弹窗
    function closeAuthModal() {
      document.getElementById('authModal').style.display = 'none';
    }

    // 保存设置（包括修改密码）
    function saveSystemSettings() {
      const newPwdInput = document.getElementById('newAdminPassword').value.trim();

      // 如果填写了新密码，更新本地存储
      if (newPwdInput.length > 0) {
        if (newPwdInput.length < 6) {
          alert('密码长度建议不少于 6 位');
          return;
        }
        localStorage.setItem(STORAGE_KEY, newPwdInput);
        document.getElementById('newAdminPassword').value = ''; // 提交后清空输入框
        alert('配置保存成功，管理员密码已成功修改！');
      } else {
        alert('配置规则已保存！');
      }
    }
  </script>

</body>
</html>
